<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams - Elite Tournament</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CORE SETUP --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
                url('https://img.freepik.com/free-vector/dark-hexagonal-background-with-gradient-color_79603-1409.jpg');
            background-size: cover;
            background-attachment: fixed;
        }

        /* --- 2. NAVIGATION BAR --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            font-weight: 900;
        }

        .nav ul {
            display: flex;
            gap: 20px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav a {
            text-decoration: none;
            color: #ccc;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 5px 10px;
            transition: 0.3s;
            position: relative;
            white-space: nowrap; /* Text ko tutne se rokega */
        }

        .nav a:hover, .nav a.active {
            color: #fff;
            text-shadow: 0 0 10px #00f3ff;
        }

        .nav a.active::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0; width: 100%; height: 2px;
            background: #00f3ff;
            box-shadow: 0 0 10px #00f3ff;
        }

        /* --- 3. MAIN CARD --- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .glass-panel {
            background: rgba(10, 20, 30, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 800px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.5);
            animation: floatCard 4s ease-in-out infinite;
            position: relative;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            position: relative;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #ff0055, -2px -2px 0px #00f3ff;
            animation: glitchAnim 3s infinite;
        }

        .sub-text {
            color: #00f3ff;
            font-size: 1.2rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- 5. NEON HOURGLASS --- */
        .neon-hourglass {
            position: relative;
            width: 80px;
            height: 100px;
            margin: 0 auto 40px auto;
            border: 3px solid #ffaa00;
            border-radius: 5px;
            box-shadow: 0 0 15px #ffaa00, inset 0 0 10px #ffaa00;
            clip-path: polygon(0 0, 100% 0, 50% 50%, 100% 100%, 0 100%, 50% 50%);
            background: rgba(255, 170, 0, 0.1);
            animation: rotateNeon 3s infinite ease-in-out;
            overflow: hidden;
        }

        .neon-hourglass::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #ffaa00 50%, transparent 50%);
            animation: sandFlow 3s infinite linear;
        }

        /* --- 6. COUNTDOWN TIMERS --- */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .time-box:hover {
            border-color: #00f3ff;
            box-shadow: 0 0 15px #00f3ff;
            transform: translateY(-5px);
        }

        .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #fff;
            display: block;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .label {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-top: 5px;
            display: block;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 0.8rem;
            background: black;
            border-top: 1px solid #111;
        }

        /* --- ANIMATIONS --- */
        @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes rotateNeon { 0% { transform: rotate(0deg); } 45% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } 95% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
        @keyframes sandFlow { 0% { top: -50%; } 50% { top: 0%; } 100% { top: 50%; } }
        @keyframes glitchAnim { 0% { text-shadow: 2px 2px 0px #ff0055, -2px -2px 0px #00f3ff; } 25% { text-shadow: -2px 2px 0px #ff0055, 2px -2px 0px #00f3ff; } 50% { text-shadow: 2px -2px 0px #ff0055, -2px 2px 0px #00f3ff; } 75% { text-shadow: -2px -2px 0px #ff0055, 2px 2px 0px #00f3ff; } 100% { text-shadow: 2px 2px 0px #ff0055, -2px -2px 0px #00f3ff; } }

        /* --- ⚠️ MOBILE FIX IS HERE ⚠️ --- */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 10px;
            }

            .logo {
                margin-bottom: 5px;
            }

            .nav ul {
                flex-wrap: wrap; /* Isse items niche wali line me aa jayenge */
                justify-content: center; /* Beech me rahenge */
                gap: 10px; /* Gap kam kiya taaki fit ho */
            }

            .nav a {
                font-size: 0.9rem; /* Font thoda chota kiya */
                padding: 5px 8px; /* Padding kam ki */
            }

            .glitch-title { font-size: 2rem; }
            .glass-panel { padding: 20px; }
            .time-box { padding: 10px; }
            .number { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">KADDU GAMING</div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="rules.html">Rules</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="teams.html" class="active">Teams</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="glass-panel">
            
            <div class="neon-hourglass"></div>

            <h1 class="glitch-title">TOURNAMENT LIVE</h1>
            
            <p class="sub-text">
                Season 3: The Final Showdown<br>
                <span style="color: white; font-weight: bold; font-size: 1.5rem; margin-top: 10px; display: inline-block;">Dec 21, 2025 • 04:00 PM</span>
            </p>

            <div class="timer-grid">
                <div class="time-box">
                    <span class="number" id="days">00</span>
                    <span class="label">Days</span>
                </div>
                <div class="time-box">
                    <span class="number" id="hours">00</span>
                    <span class="label">Hrs</span>
                </div>
                <div class="time-box">
                    <span class="number" id="minutes">00</span>
                    <span class="label">Min</span>
                </div>
                <div class="time-box">
                    <span class="number" id="seconds">00</span>
                    <span class="label">Sec</span>
                </div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2025 CRAZY KADDU. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // TARGET DATE
        const targetDate = new Date("December 21, 2025 16:00:00").getTime();

        const timer = setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? "0" + d : d;
            document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
            document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
            document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;

            if (diff < 0) {
                clearInterval(timer);
                document.querySelector(".timer-grid").innerHTML = "<h2 style='color:#00f3ff; font-size:2rem; grid-column: span 4;'>BATTLE STARTED!</h2>";
                document.querySelector(".neon-hourglass").style.borderColor = "#00f3ff";
            }
        }, 1000);
    </script>

</body>
</html>
