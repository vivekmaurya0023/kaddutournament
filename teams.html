<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Team - Tournament Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      padding-top: 130px;
      animation: fadeInBody 2s ease-out;
    }

    header {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px 0;
      width: 100%;
      position: fixed;
      top: 0;
      text-align: center;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      animation: slideInHeader 1s ease-out;
    }

    h1 {
      font-size: 3rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
    }

    .team-card {
      background-color: rgba(0, 0, 0, 0.8);
      width: 90%;
      max-width: 600px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      animation: fadeInCard 1s ease-out;
      color: #fff;
    }

    .team-card h3 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .team-card h4 {
      font-size: 1.5rem;
      margin: 20px 0;
      color: #ffcc00;
    }

    .team-card p {
      font-size: 1rem;
      margin: 10px 0;
      color: #ddd;
    }

    .team-card p b {
      color: #ffcc00;
    }

    .animated-button {
      display: inline-block;
      margin: 30px 15px;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    .animated-button:hover {
      background-color: #218838;
      transform: scale(1.1);
      box-shadow: 3px 3px 15px rgba(0, 0, 0, 0.4);
    }

    @keyframes fadeInBody {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes slideInHeader {
      0% {
        transform: translateY(-50px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInCard {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1> Tournament Registration</h1>
  </header>


  <button class="animated-button" onclick="window.location.href='ADMIN.html'">CURRENT LIST </button>
  <button class="animated-button" onclick="window.location.href='firstour.html'">FIRST TOURNAMENT TEAMS</button>
  <button class="animated-button" onclick="window.location.href='sectour.html'">SECOND TOURNAMENT TEAMS</button>
  <button class="animated-button" onclick="window.location.href='index.html'">Back to Home</button>
</body>
</html>
