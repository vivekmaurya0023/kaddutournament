  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: #fff;
      text-align: center;
      min-height: 100vh;
      padding-top: 130px;
      padding-bottom: 50px;
      animation: fadeInBody 2s ease-out;
    }

    header {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px 0;
      width: 100%;
      position: fixed;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      animation: slideInHeader 1s ease-out;
    }

    h1 {
      font-size: 3rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
    }

    /* CARD DESIGN WITH IMAGE */
    .team-card {
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      width: 90%;
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeInCard 1s ease-out;
      color: #fff;
      
      /* Flexbox for Side-by-Side Layout */
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .card-info {
        flex: 1;
        padding-right: 20px;
    }

    .team-card h3 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #fff;
      text-transform: uppercase;
    }

    .team-card h4 {
      font-size: 1.2rem;
      margin: 5px 0;
      color: #ffcc00;
    }

    .team-card p {
      font-size: 1rem;
      margin: 5px 0;
      color: #ddd;
    }

    .team-card p b { color: #00ffcc; }

    /* IMAGE SECTION STYLES */
    .card-image {
        text-align: center;
        min-width: 120px;
    }

    .payment-label {
        display: block;
        font-size: 0.8rem;
        color: #aaa;
        margin-bottom: 5px;
        text-transform: uppercase;
    }

    .payment-img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border: 2px solid #fff;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.3s;
    }

    .payment-img:hover {
        transform: scale(1.1);
        border-color: #ffcc00;
    }

    /* Responsive Mobile View */
    @media (max-width: 600px) {
        .team-card {
            flex-direction: column;
            text-align: center;
        }
        .card-info { padding-right: 0; margin-bottom: 20px; }
    }

    /* BUTTONS */
    .animated-button {
      display: inline-block;
      margin: 20px 10px;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #28a745;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }
    .animated-button:hover { background-color: #218838; transform: scale(1.05); }

    /* MODAL FOR IMAGE ZOOM */
    #imgModal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; }
    #fullImage { max-width: 90%; max-height: 90%; border: 3px solid white; box-shadow: 0 0 20px #ffcc00; }
    .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; }

    @keyframes fadeInBody { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes slideInHeader { 0% { transform: translateY(-50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes fadeInCard { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>
</head>
