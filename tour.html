<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free Fire Tournament</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="
margin:0;
padding:0;
background:radial-gradient(circle at top,#111,#000);
color:white;
font-family:'Segoe UI',sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
">

<div style="width:100%;max-width:420px;padding:20px;box-sizing:border-box;">

<h1 style="
text-align:center;
font-size:2.3rem;
font-weight:800;
letter-spacing:3px;
margin-bottom:20px;
text-shadow:0 0 15px red;
">
FREE FIRE<br>TOURNAMENT
</h1>

<form id="tourneyForm" style="
background:rgba(255,255,255,0.05);
border-radius:18px;
padding:25px;
border:1px solid rgba(255,69,0,0.4);
box-shadow:0 0 20px rgba(255,0,0,0.2);
">

<label>Team Name</label>
<input required style="width:100%;padding:12px;margin:6px 0 14px;background:#000;color:white;border:1px solid #333;border-radius:8px">

<label>Leader UID</label>
<input type="number" required style="width:100%;padding:12px;margin:6px 0 14px;background:#000;color:white;border:1px solid #333;border-radius:8px">

<label>In-Game Name</label>
<input required style="width:100%;padding:12px;margin:6px 0 14px;background:#000;color:white;border:1px solid #333;border-radius:8px">

<label>Payment Screenshot</label>
<input type="file" accept="image/*" required style="width:100%;padding:10px;margin:6px 0 18px;background:#111;color:white;border-radius:8px">

<button type="submit" style="
width:100%;
padding:14px;
background:linear-gradient(45deg,red,#ff4500);
border:none;
border-radius:30px;
font-size:1rem;
font-weight:bold;
color:white;
cursor:pointer;
box-shadow:0 0 20px red;
">
Submit Registration
</button>

</form>
</div>

<!-- POPUP -->
<div id="popup" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.75);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
">
  <div style="
  background:#111;
  padding:25px 30px;
  border-radius:15px;
  box-shadow:0 0 25px red;
  text-align:center;
  ">
    <div id="popupText" style="color:#ffcc00;font-weight:bold">
      Submitting...
    </div>
  </div>
</div>

<!-- 🔥 FIREBASE + JS (SAB EK HI JAGAH) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js";

// 🔥 TERA FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyC87FgEFqiU-Hxly57h_E1eQfutn2yp6ik",
  authDomain: "freefire-tournament-8de8c.firebaseapp.com",
  projectId: "freefire-tournament-8de8c",
  storageBucket: "freefire-tournament-8de8c.appspot.com",
  messagingSenderId: "718786943416",
  appId: "1:718786943416:web:403b061404c88b0261d74d"
};

// INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// POPUP
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");

function showPopup(text){
  popupText.innerText = text;
  popup.style.display = "flex";
}
function hidePopup(){
  popup.style.display = "none";
}

// FORM SUBMIT
document.getElementById("tourneyForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const form = e.target;
  const teamName = form[0].value;
  const uid = form[1].value;
  const ign = form[2].value;
  const file = form[3].files[0];

  showPopup("Submitting...");

  try{
    const imgRef = ref(storage, "payments/" + Date.now() + "_" + file.name);
    await uploadBytes(imgRef, file);
    const imgURL = await getDownloadURL(imgRef);

    await addDoc(collection(db, "tournament_registrations"), {
      teamName,
      leaderUID: uid,
      leaderIGN: ign,
      screenshot: imgURL,
      time: serverTimestamp()
    });

    showPopup("✅ Registration Successful!");
    setTimeout(()=>{
      hidePopup();
      form.reset();
    },2000);

  }catch(err){
    console.error(err);
    showPopup("❌ Error! Try Again");
    setTimeout(hidePopup,2000);
  }
});
</script>

</body>
</html>
